worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 # Keep nginx's validated host and an optional numeric client port.
 map $http_host $tasksure_port {
  default '';
  ~:(?<request_host_port>[0-9]+)$ :$request_host_port;
 }
 access_log /dev/stdout;
 sendfile on;
 server {
  listen __PORT__;
  root /app/public;
  index index.php;
  client_max_body_size __UPLOAD_MB__m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location / { try_files $uri $uri/ /index.php?$query_string; }
  location = /index.php { include /etc/nginx/fastcgi_params; fastcgi_param HTTP_HOST $host$tasksure_port; fastcgi_param SCRIPT_FILENAME /app/public/index.php; fastcgi_param HTTP_PROXY ""; fastcgi_pass 127.0.0.1:9000; }
  location ~ \.php$ { return 404; }
  location ~ /\. { deny all; }
 }
}
