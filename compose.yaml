services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tasksure
      MYSQL_USER: tasksure
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build: .
    image: tasksure:local
    env_file: .env
    environment:
      DB_HOST: db
      PROCESS_ROLE: web
      UPLOAD_STORAGE_PATH: /data/uploads
      SESSION_SECURE_COOKIE: 'false'
    ports: ['8080:8080']
    volumes: ['evidence:/data']
    depends_on:
      db: {condition: service_healthy}
  worker:
    image: tasksure:local
    env_file: .env
    environment: {DB_HOST: db, PROCESS_ROLE: worker}
    depends_on: [web]
  scheduler:
    image: tasksure:local
    env_file: .env
    environment: {DB_HOST: db, PROCESS_ROLE: scheduler}
    depends_on: [web]
volumes:
  mysql:
  evidence:
