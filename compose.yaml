services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: tasksure
      POSTGRES_USER: tasksure
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tasksure -d tasksure']
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build: .
    image: tasksure:local
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: '5432'
      PROCESS_ROLE: web
      UPLOAD_STORAGE_PATH: /data/uploads
      SESSION_SECURE_COOKIE: 'false'
    ports: ['8080:8080']
    volumes: ['evidence:/data']
    depends_on:
      db: {condition: service_healthy}
  worker:
    image: tasksure:local
    env_file: .env
    environment: {DB_CONNECTION: pgsql, DB_HOST: db, DB_PORT: '5432', PROCESS_ROLE: worker}
    depends_on: [web]
  scheduler:
    image: tasksure:local
    env_file: .env
    environment: {DB_CONNECTION: pgsql, DB_HOST: db, DB_PORT: '5432', PROCESS_ROLE: scheduler}
    depends_on: [web]
volumes:
  postgres:
  evidence:
