name: TaskSure checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tasksure_test
          POSTGRES_USER: tasksure
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U tasksure -d tasksure_test" --health-interval=10s --health-timeout=5s --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tasksure_test
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_mysql, pdo_sqlite, mbstring, gd, zip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci && npm run build
      - run: npm ci && npm test && npm run build && npx cap sync
        working-directory: mobile
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
      - run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: tasksure_test
          DB_USERNAME: tasksure
          DB_PASSWORD: ci-only-password
      - run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tasksure_test
          DB_USERNAME: root
          DB_PASSWORD: ci-only-password
      - run: vendor/bin/pint --test
      - run: npm run check:railway
